<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; background-color: #222; color: white; }
        canvas { background: black; display: block; margin: 0 auto; border: 2px solid white; }
        #score { font-size: 20px; margin-top: 10px; }
        #restart { display: none; margin-top: 10px; padding: 10px; background: lime; color: black; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Snake Game</h1>
    <p id="score">Score: 0</p>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <button id="restart" onclick="startGame()">Restart</button>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score");
        const restartButton = document.getElementById("restart");

        let snake, direction, food, score, gameInterval, obstacles;

        function startGame() {
            snake = [{x: 200, y: 200}];
            direction = "RIGHT";
            food = {x: 100, y: 100};
            score = 0;
            obstacles = [
                {x: 100, y: 200}, {x: 300, y: 200},
                {x: 200, y: 100}, {x: 200, y: 300}
            ];
            scoreDisplay.innerText = "Score: 0";
            restartButton.style.display = "none";
            clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 150);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "lime" : "green";
                ctx.fillRect(part.x, part.y, 20, 20);
                if (index === 0) drawEyes(part.x, part.y);
            });
        }

        function drawEyes(x, y) {
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(x + 5, y + 5, 3, 0, Math.PI * 2);
            ctx.arc(x + 15, y + 5, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        function moveSnake() {
            let head = { ...snake[0] };
            if (direction === "RIGHT") head.x += 20;
            if (direction === "LEFT") head.x -= 20;
            if (direction === "UP") head.y -= 20;
            if (direction === "DOWN") head.y += 20;
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreDisplay.innerText = "Score: " + score;
                food = {x: Math.floor(Math.random() * 20) * 20, y: Math.floor(Math.random() * 20) * 20};
            } else {
                snake.pop();
            }
        }

        function drawFood() {
            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, 20, 20);
        }

        function drawObstacles() {
            ctx.fillStyle = "gray";
            obstacles.forEach(obs => ctx.fillRect(obs.x, obs.y, 20, 20));
        }

        function checkCollision() {
            const head = snake[0];
            if (
                head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height || 
                snake.slice(1).some(part => part.x === head.x && part.y === head.y) ||
                obstacles.some(obs => obs.x === head.x && obs.y === head.y)
            ) {
                clearInterval(gameInterval);
                alert("Game Over! Your Score: " + score);
                restartButton.style.display = "block";
            }
        }

        function updateGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            moveSnake();
            checkCollision();
            drawSnake();
            drawFood();
            drawObstacles();
        }

        document.addEventListener("keydown", event => {
            if (event.key === "ArrowUp" && direction !== "DOWN") direction = "UP";
            if (event.key === "ArrowDown" && direction !== "UP") direction = "DOWN";
            if (event.key === "ArrowLeft" && direction !== "RIGHT") direction = "LEFT";
            if (event.key === "ArrowRight" && direction !== "LEFT") direction = "RIGHT";
        });

        startGame();
    </script>
</body>
</html>
