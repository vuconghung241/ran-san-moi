<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rắn Săn Mồi</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #282c34;
            color: white;
        }
        canvas {
            background-color: black;
            display: block;
            margin: auto;
        }
        .controls {
            margin-top: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>🐍 Rắn Săn Mồi 🕹</h1>
    <h2>Điểm: <span id="score">0</span></h2>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="controls">
        <button onclick="startGame()">🎮 Bắt đầu chơi</button>
        <button onclick="resetGame()">🔄 Chơi lại</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score");

        const box = 20; // Kích thước mỗi ô
        let snake = [{ x: 200, y: 200 }]; // Rắn bắt đầu
        let direction = "RIGHT"; // Hướng di chuyển
        let food = spawnFood();
        let obstacles = generateObstacles(5); // 5 chướng ngại vật
        let score = 0;
        let gameRunning = false;
        let speed = 200; // Tốc độ ban đầu (ms)
        let gameInterval;

        function drawSnake() {
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? "lime" : "green"; // Đầu màu khác
                ctx.fillRect(segment.x, segment.y, box, box);
                ctx.strokeStyle = "black";
                ctx.strokeRect(segment.x, segment.y, box, box);

                // Vẽ mắt rắn
                if (index === 0) {
                    ctx.fillStyle = "white";
                    ctx.fillRect(segment.x + 4, segment.y + 4, 5, 5);
                    ctx.fillRect(segment.x + 12, segment.y + 4, 5, 5);
                }
            });
        }

        function drawFood() {
            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, box, box);
        }

        function drawObstacles() {
            ctx.fillStyle = "gray";
            obstacles.forEach(obstacle => {
                ctx.fillRect(obstacle.x, obstacle.y, box, box);
            });
        }

        function spawnFood() {
            return {
                x: Math.floor(Math.random() * (canvas.width / box)) * box,
                y: Math.floor(Math.random() * (canvas.height / box)) * box
            };
        }

        function generateObstacles(count) {
            let obs = [];
            for (let i = 0; i < count; i++) {
                obs.push(spawnFood());
            }
            return obs;
        }

        function moveSnake() {
            if (!gameRunning) return;

            let head = { ...snake[0] };

            if (direction === "UP") head.y -= box;
            if (direction === "DOWN") head.y += box;
            if (direction === "LEFT") head.x -= box;
            if (direction === "RIGHT") head.x += box;

            // Kiểm tra va chạm
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height || 
                snake.some(segment => segment.x === head.x && segment.y === head.y) ||
                obstacles.some(obstacle => obstacle.x === head.x && obstacle.y === head.y)) {
                alert("💀 Game Over! Điểm: " + score);
                gameRunning = false;
                clearInterval(gameInterval);
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreDisplay.textContent = score;
                food = spawnFood();
                increaseSpeed(); // Tăng tốc độ khi ăn
            } else {
                snake.pop();
            }
        }

        function increaseSpeed() {
            speed *= 0.99; // Giảm 1% thời gian giữa mỗi bước -> nhanh hơn
            clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, speed);
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawSnake();
            drawFood();
            drawObstacles();
        }

        function gameLoop() {
            if (gameRunning) {
                moveSnake();
                drawGame();
            }
        }

        function startGame() {
            if (!gameRunning) {
                gameRunning = true;
                snake = [{ x: 200, y: 200 }];
                direction = "RIGHT";
                food = spawnFood();
                obstacles = generateObstacles(5);
                score = 0;
                speed = 200; // Reset tốc độ ban đầu
                scoreDisplay.textContent = score;
                clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, speed);
            }
        }

        function resetGame() {
            gameRunning = false;
            clearInterval(gameInterval);
            startGame();
        }

        window.addEventListener("keydown", event => {
            if (event.key === "ArrowUp" && direction !== "DOWN") direction = "UP";
            if (event.key === "ArrowDown" && direction !== "UP") direction = "DOWN";
            if (event.key === "ArrowLeft" && direction !== "RIGHT") direction = "LEFT";
            if (event.key === "ArrowRight" && direction !== "LEFT") direction = "RIGHT";
        });

        // Vẽ màn hình ban đầu
        drawGame();
    </script>
</body>
</html>
